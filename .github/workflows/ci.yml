name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Testes automatizados (pontuação, casos, conteúdo, mapas, salvamento, pets)
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Testes do banco de dados (regras de acesso por conta, em PostgreSQL)
        run: npm run test:db
